<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classificador de Emails</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/index.css" rel="stylesheet">
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <!-- Form Card -->
      <div class="card p-4">
        <h2 class="text-center mb-4">📧 Classificador de Emails</h2>
        <form id="uploadForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label" for="emailText">Texto do email:</label>
            <textarea class="form-control" rows="5" id="emailText" name="emailText" placeholder="Insira aqui o texto do email..."></textarea>
          </div>
          <div class="mb-3">
            <label for="emailFile" class="form-label">Ou envie um arquivo (.txt, .eml ou .pdf)</label>
            <input class="form-control" type="file" id="emailFile" name="file">
          </div>
          <div class="d-grid">
            <button class="btn btn-primary btn-lg" type="submit">Enviar</button>
          </div>
        </form>
      </div>

      <!-- Results Section -->
      <div id="results" class="card p-4 mt-4" hidden>
        <h3 class="mb-3">📊 Resultado</h3>
        <p>Classificação do Email: <span class="badge bg-info text-dark fs-6" id="emailClassification"></span></p>
        
        <h5 class="mt-4">✨ Sugestão de resposta da IA</h5>
        <div class="d-flex align-items-start mb-3">
          <p class="flex-grow-1 border rounded p-3 bg-light" id="aiSuggestion"></p>
          <div class="d-flex flex-column ms-2">
            <button class="btn btn-outline-secondary btn-sm mb-1" onclick="copyText('aiSuggestion')">📋 Copiar</button>
            <button class="btn btn-outline-success btn-sm" onclick="mailtoText('aiSuggestion')">✉️ Enviar</button>
          </div>
        </div>

        <h5>📝 Outra sugestão</h5>
        <div class="d-flex align-items-start">
          <p class="flex-grow-1 border rounded p-3 bg-light" id="templateSuggestion"></p>
          <div class="d-flex flex-column ms-2">
            <button class="btn btn-outline-secondary btn-sm mb-1" onclick="copyText('templateSuggestion')">📋 Copiar</button>
            <button class="btn btn-outline-success btn-sm" onclick="mailtoText('templateSuggestion')">✉️ Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay">
  <div class="text-center">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3">Processando email, aguarde...</p>
  </div>
</div>

<script src="js/script.js"></script>

</body>
</html>
