<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Classificador de Emails</title>
</head>
<body>
    <form id="uploadForm" enctype="multipart/form-data">
        <div>
            <label for="emailText">Texto do email:</label>
            <input type="text" id="emailText" name="emailText">
        </div>
        <div>
            <label for="emailFile">Arquivo (.txt ou .pdf)</label>
            <input type="file" id="emailFile" name="file">
        </div>
        <button type="submit">Submit</button>
    </form>

    <div> <!-- Results Div -->
        <h2>Classificação do Email: <strong id="emailClassification"></strong></h2>
        
        <h4>Sugestão de resposta da IA</h4>
        <p id="aiSuggestion"></p>

        <h4>Outra sugestão</h4>
        <p id="templateSuggestion"></p>
    </div>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
